function followLoop(){
  const kind = cursorStyle();
  if(!followOn()){ if(follow.el){ follow.el.remove(); follow.dot.remove(); follow.el = follow.dot = null; } follow.on = false; return; }
  if(!follow.el || follow.kind !== kind){
    if(follow.el){ follow.el.remove(); follow.dot.remove(); }
    follow.kind = kind; follow.was = null;
    follow.el = document.createElement("div"); follow.el.className = "fx-" + kind;
    if(kind === "focus") follow.el.innerHTML = "<i></i><i></i><i></i><i></i><b>AF</b><em></em>";
    if(kind === "engagement") follow.el.innerHTML = ENGAGEMENT_RING + `<svg class="gl" viewBox="-10 -10 20 20"><path d="M0-10C1-2 2-1 10 0 2 1 1 2 0 10-1 2-2 1-10 0-2-1-1-2 0-10Z" fill="#fff"/></svg>`;
    follow.dot = document.createElement("div"); follow.dot.className = "fx-dot" + (kind === "engagement" ? " hide" : "");
    document.body.append(follow.el, follow.dot);
  }
  follow.x += (follow.tx - follow.x) * (kind === "focus" ? .16 : .12); follow.y += (follow.ty - follow.y) * (kind === "focus" ? .16 : .12);
  follow.dx += (follow.tx - follow.dx) * .5; follow.dy += (follow.ty - follow.dy) * .5;
  if(follow.over !== follow.was){
    follow.was = follow.over;
    follow.el.classList.toggle("over", follow.over);
    if(follow.over && kind === "focus"){ follow.el.classList.remove("lock"); void follow.el.offsetWidth; follow.el.classList.add("lock"); }
  }
  const swing = Math.max(-28, Math.min(28, (follow.tx - follow.x) * .35));
  follow.rot = (follow.rot || 0) + (swing - (follow.rot || 0)) * .12;
  follow.el.style.transform = `translate3d(${follow.x.toFixed(1)}px,${follow.y.toFixed(1)}px,0)` + (kind === "engagement" ? ` rotate(${follow.rot.toFixed(1)}deg)` : "");
  follow.dot.style.transform = `translate3d(${follow.dx.toFixed(1)}px,${follow.dy.toFixed(1)}px,0)`;
  requestAnimationFrame(followLoop);
}

const HDR_ITEMS = () => [...document.querySelectorAll(".header .home-link a, .header .works button, .header .menu-text, .header .infos > a, .header .langs > a, .header .lang-switch")];
const SKIP = ".header, .overlay, .cursor, .deco, .petals, .logo, .svc-preview, .menu, .p-desc, .contact-fab, .contact-sheet";
function bgIsDark(x, y){
  for(const el of document.elementsFromPoint(x, y)){
    if(el.closest(SKIP)) continue;
    if(el.closest(".next-project, .about-discover")) return false;   // these photos are under a light veil
    if(el.tagName === "IMG" || el.tagName === "VIDEO") return true;
    if(el.classList.contains("top") || el.closest(".lightbox")) return true;
    const bg = getComputedStyle(el).backgroundColor;
    const m = bg.match(/\d+(\.\d+)?/g);
    if(m && (m.length < 4 || +m[3] > 0.5)){ const l = (+m[0] * 299 + +m[1] * 587 + +m[2] * 114) / 1000; return l < 128; }
    if(el === document.body || el === document.documentElement) return false;
  }
  return false;
}
function descTone(){
  const d = document.getElementById("pdesc"); if(!d || isMobile()) return;
  const r = d.getBoundingClientRect();
  d.style.opacity = r.top < 130 ? "0" : "";
  const dark = bgIsDark(r.left + 20, r.bottom - 14) || bgIsDark(r.left + 20, r.top + 10);
  d.classList.toggle("lt", dark); d.classList.toggle("dk", !dark);
}
function headerTone(){
  descTone();
  for(const it of HDR_ITEMS()){
    if(!it.offsetParent && getComputedStyle(it).position !== "fixed") continue;
    const r = it.getBoundingClientRect();
    if(!r.width) continue;
    const dark = bgIsDark(r.left + Math.min(r.width / 2, 40), r.top + r.height / 2) || bgIsDark(r.left + r.width - 4, r.top + r.height / 2);
    it.classList.toggle("lt", dark);
  }
}

/* =================================================================
   PHOTOS: read straight from the photos/ folders of the GitHub repository.
   Falls back to photos.js when GitHub can't be asked (e.g. opened from disk).
   ================================================================= */
const MEDIA_RE = /\.(jpe?g|png|webp|gif|avif|mp4|webm|mov)$/i;
function titleFromName(n){
  return n.replace(/\.[^.]+$/, "").replace(/^\d+[\s._-]*/, "").replace(/[_]+/g, " ").replace(/\b(cover|hero)\b/ig, "").replace(/\s{2,}/g, " ").replace(/^[\s-]+|[\s-]+$/g, "");
}
function makeItems(list){
  const links = (window.SITE && window.SITE.musicVideoLinks) || {};
  const titles = (window.SITE && window.SITE.musicVideoTitles) || {};
  return list.filter(f => MEDIA_RE.test(f.name)).map(f => ({
    cat: f.cat, name: f.name, src: "photos/" + f.cat + "/" + encodeURIComponent(f.name),
    kind: /\.(mp4|webm|mov)$/i.test(f.name) ? "video" : "image",
    title: f.cat === "music-videos" ? (titles[f.name] || titleFromName(f.name)) : "",
    link: links[f.name] || ""
  })).sort((a, b) => a.cat === b.cat ? a.name.localeCompare(b.name, undefined, { numeric: true }) : 0);
}
function repoInfo(){
  const g = (window.SITE && window.SITE.github) || {};
  if(g.owner && g.repo) return g;
  const host = location.hostname;
  if(!host.endsWith(".github.io")) return null;
  const owner = host.split(".")[0];
  const first = location.pathname.split("/").filter(Boolean)[0];
  return { owner, repo: first || host };
}
async function fromGitHub(){
  const r = repoInfo();
  if(!r) throw new Error("not on GitHub");
  const key = "dk-photos-" + r.owner + "/" + r.repo;
  try{ const c = JSON.parse(sessionStorage.getItem(key) || "null"); if(c && Date.now() - c.t < 5 * 60e3) return c.list; }catch(_){}
  const list = [];
  for(const cat of CATS.map(c => c.slug)){
    const res = await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/photos/${cat}`);
    if(res.status === 404) continue;
    if(!res.ok) throw new Error("GitHub " + res.status);
    (await res.json()).forEach(f => { if(f.type === "file") list.push({ cat, name: f.name }); });
  }
  try{ sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), list })); }catch(_){}
  return list;
}
async function loadPhotos(){
  let list;
  try{
    list = await Promise.race([fromGitHub(), new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 5000))]);
  }catch(_){ list = window.PHOTOS || []; }
  S.photos = makeItems(list);
}

/* ---------- opening screen: grass and flowers grow up from the bottom of the page ---------- */
const INTRO_START = performance.now();
const meadow = { exit: 0 };
(function growMeadow(){
  return;   // opening animation turned off: minimal intro
  const box = $("#introFlowers");
  const cv = document.createElement("canvas"); box.appendChild(cv);
  const ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight, mob = isMobile();
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const heads = FLOWERS.map(src => { const i = new Image(); i.src = src; return i; });
  const rnd = (a, b) => a + Math.random() * (b - a);
  const greens = ["#6f8f3a", "#86a646", "#5d7d33", "#9cb35a", "#7a9a3e", "#4f6f2c"];
  // grass blades
  const blades = Array.from({ length: Math.round(W / (mob ? 3.2 : 3.6)) }, () => ({
    x: rnd(-10, W + 10), h: H * rnd(mob ? .06 : .05, mob ? .16 : .14), w: rnd(1.6, 3.6),
    lean: rnd(-.35, .35), c: greens[Math.floor(Math.random() * greens.length)],
    d: rnd(0, .55), ph: rnd(0, 6.28), sp: rnd(.9, 1.6)
  }));
  // flowers on stems
  const maxStem = H * (mob ? .58 : .52);
  const flowers = Array.from({ length: Math.round(W / (mob ? 26 : 34)) }, (_, k) => {
    const h = rnd(H * .16, maxStem) * (0.6 + 0.4 * Math.random());
    return { x: (k + rnd(.1, .9)) / Math.round(W / (mob ? 26 : 34)) * W, h, lean: rnd(-.18, .18),
      size: (mob ? 15 : 20) + (h / maxStem) * (mob ? 14 : 20) + rnd(-3, 3),
      img: heads[k % heads.length], d: rnd(.25, 1.05), grow: rnd(.9, 1.3), ph: rnd(0, 6.28), sp: rnd(.7, 1.2),
      leaf: Math.random() < .7 ? rnd(.25, .55) : 0, leafSide: Math.random() < .5 ? -1 : 1, rot: rnd(-.3, .3) };
  });
  flowers.sort((a, b) => a.h - b.h);   // short ones behind? draw tall first so short are in front
  flowers.reverse();
  const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  const pop = t => { t = Math.min(1, Math.max(0, t)); return t < .7 ? (t / .7) * 1.15 : 1.15 - .15 * ((t - .7) / .3); };
  function stemPath(x0, y0, len, lean, sway){
    const tx = x0 + lean * len + sway, ty = y0 - len;
    const cx = x0 + lean * len * .2 + sway * .3, cy = y0 - len * .55;
    return { tx, ty, cx, cy };
  }
  function frame(now){
    if(!document.getElementById("intro") || meadow.frozen) return;
    const t = (now - INTRO_START) / 1000;
    const gust = meadow.exit ? Math.min(1, (now - meadow.exit) / 700) : 0;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(0, gust * gust * H * .5);
    ctx.globalAlpha = 1 - gust;
    const wind = Math.sin(t * .9) * .5 + .5;
    // flowers (behind the front grass)
    for(const f of flowers){
      const g = reduceMotion ? 1 : ease((t - f.d) / f.grow);
      if(g <= 0) continue;
      const len = f.h * g, sway = (Math.sin(t * f.sp + f.ph) * 6 + wind * 5) * (len / maxStem) * 1.4;
      const p = stemPath(f.x, H + 4, len, f.lean, sway);
      ctx.strokeStyle = "#5f8232"; ctx.lineWidth = mob ? 1.5 : 1.8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(f.x, H + 4); ctx.quadraticCurveTo(p.cx, p.cy, p.tx, p.ty); ctx.stroke();
      if(f.leaf && g > f.leaf){
        const lt = f.leaf, lx = f.x + (p.cx - f.x) * lt * 1.6, ly = H - len * lt;
        const ls = Math.min(1, (g - f.leaf) * 4) * (mob ? 9 : 12);
        ctx.fillStyle = "#6f9439";
        ctx.beginPath(); ctx.ellipse(lx + f.leafSide * ls * .7, ly - ls * .25, ls, ls * .32, f.leafSide * -.6, 0, 6.29); ctx.fill();
      }
      const b = reduceMotion ? 1 : pop((t - f.d - f.grow * .82) / .45);
      if(b > 0 && f.img.complete && f.img.naturalWidth){
        const sz = f.size * b;
        ctx.save(); ctx.translate(p.tx, p.ty); ctx.rotate(f.rot + sway * .01);
        ctx.shadowColor = "rgba(0,0,0,.15)"; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
        ctx.drawImage(f.img, -sz / 2, -sz / 2, sz, sz); ctx.restore();
      }
    }
    // grass in front
    for(const bl of blades){
      const g = reduceMotion ? 1 : ease((t - bl.d) / .8);
      if(g <= 0) continue;
      const h = bl.h * g, sway = (Math.sin(t * bl.sp + bl.ph) * 3 + wind * 4) * (h / (H * .15));
      const tx = bl.x + bl.lean * h + sway, ty = H - h;
      ctx.fillStyle = bl.c;
      ctx.beginPath(); ctx.moveTo(bl.x - bl.w, H + 2);
      ctx.quadraticCurveTo(bl.x + bl.lean * h * .3 - bl.w * .5, H - h * .5, tx, ty);
      ctx.quadraticCurveTo(bl.x + bl.lean * h * .3 + bl.w * .5, H - h * .5, bl.x + bl.w, H + 2);
      ctx.fill();
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  meadow.canvas = cv;
})();

/* the camera slides in, takes the picture, and the meadow becomes a film print */
async function takePicture(){
  const intro = $("#intro"), sleep = ms => new Promise(r => setTimeout(r, ms));
  if(!intro) return;
  $(".intro-logo").animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-10px)" }], { duration: 400, fill: "forwards" });
  $(".intro-name").animate([{ opacity: .85 }, { opacity: 0 }], { duration: 350, fill: "forwards" });
  if(reduceMotion){ await sleep(400); return; }
  const cam = document.createElement("div"); cam.className = "cam"; cam.innerHTML = CAMERA_SVG; intro.appendChild(cam);
  const flash = document.createElement("div"); flash.className = "flash"; intro.appendChild(flash);
  // 1. camera comes down into view
  await cam.animate([{ opacity: 0, transform: "translateY(-40px) rotate(-4deg)" }, { opacity: 1, transform: "translateY(0) rotate(0)" }],
    { duration: 650, easing: "cubic-bezier(.2,.8,.25,1)", fill: "forwards" }).finished;
  await sleep(250);
  // 2. click: small press + flash, meadow freezes
  cam.animate([{ transform: "translateY(0)" }, { transform: "translateY(3px) scale(.985)" }, { transform: "translateY(0)" }], { duration: 180, fill: "forwards" });
  meadow.frozen = true;
  let shot = "";
  try{
    const c = meadow.canvas, out = document.createElement("canvas");
    const top = Math.round(c.height * (isMobile() ? .36 : .42));          // frame the flowers, not the empty sky
    out.width = c.width; out.height = c.height - top;
    const g = out.getContext("2d"); g.fillStyle = "#fafafa"; g.fillRect(0, 0, out.width, out.height); g.drawImage(c, 0, top, c.width, out.height, 0, 0, out.width, out.height);
    meadow.shotRatio = out.height / out.width;
    shot = out.toDataURL("image/jpeg", .85);
  }catch(_){}
  await flash.animate([{ opacity: 0 }, { opacity: 1, offset: .25 }, { opacity: 0 }], { duration: 420, easing: "ease-out", fill: "forwards" }).finished;
  // 3. the meadow turns into a printed photo
  cam.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-20px)" }], { duration: 350, fill: "forwards" });
  if(shot){
    const W = innerWidth, H = innerHeight, pw = Math.min(W * (isMobile() ? .78 : .42), 600), ph = pw * meadow.shotRatio;
    const pr = document.createElement("div"); pr.className = "print";
    pr.style.width = pw + "px"; pr.style.height = (ph + (isMobile() ? 38 : 52)) + "px";
    pr.innerHTML = `<img src="${shot}" alt=""><span class="grain"></span><p>DENIZKREATIVE</p>`;
    pr.querySelector("img").style.height = ph + "px";
    intro.appendChild(pr);
    meadow.canvas.style.opacity = "0";
    await pr.animate([
      { opacity: 1, transform: `translate(-50%,${(H / 2 - ph * (W / pw) / 2 - 20).toFixed(0)}px) scale(${(W / pw).toFixed(3)}) rotate(0deg)` },
      { opacity: 1, transform: "translate(-50%,-50%) scale(1) rotate(-4deg)" }
    ], { duration: 750, easing: "cubic-bezier(.25,.8,.25,1)", fill: "forwards" }).finished;
    await sleep(650);
    pr.animate([
      { transform: "translate(-50%,-50%) scale(1) rotate(-4deg)", opacity: 1 },
      { transform: "translate(-30%,40%) scale(.9) rotate(8deg)", opacity: 0 }
    ], { duration: 700, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    await sleep(200);
  }
}

function askLanguage(){
  let saved = null;
  try{ saved = localStorage.getItem("dk-language"); }catch(_){}
  if(saved || window.__dkAsked) return;
  window.__dkAsked = true;
  const pop = document.createElement("div"); pop.className = "lang-pop";
  pop.innerHTML = `<div class="lang-box" role="dialog" aria-label="Language">
      <img src="logo.png" alt="">
      <p>CHOOSE YOUR LANGUAGE<br>SCEGLI LA LINGUA</p>
      <div class="lang-choices"><button data-l="en">ENGLISH</button><button data-l="it">ITALIANO</button></div>
    </div>`;
  document.body.appendChild(pop);
  requestAnimationFrame(() => pop.classList.add("show"));
  pop.querySelectorAll("button").forEach(b => b.onclick = () => {
    const l = b.dataset.l;
    try{ localStorage.setItem("dk-language", l); }catch(_){}
    if(l !== LANG){ LANG = l; loadContent(); render(true); }
    pop.classList.remove("show"); setTimeout(() => pop.remove(), 450);
  });
}

loadPhotos().finally(() => go().then(askLanguage));

</script>
